name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and attach the .mcpb bundle
  id-token: write # npm provenance + MCP registry OIDC login

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Verified before anything is published: a bad checksum must fail the job
      # while npm and the registry are still untouched.
      - name: Download and verify mcp-publisher
        run: |
          # Pinned release + sha256 (from registry_<version>_checksums.txt on that
          # release). To update: bump both from
          # https://github.com/modelcontextprotocol/registry/releases
          PUBLISHER_VERSION="v1.8.1"
          PUBLISHER_SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          # Outside the checkout, so `mcpb pack .` below cannot sweep it into the bundle.
          cd "$RUNNER_TEMP"
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz

      # Tokenless: requires npm Trusted Publishing configured for this package
      # (npmjs.com → sevdesk-mcp → Settings → Trusted Publishing:
      # repository joosthel/sevdesk-mcp, workflow release.yml).
      # Skips when the version is already on npm so re-runs stay idempotent.
      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "sevdesk-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "sevdesk-mcp@${VERSION} is already on npm — skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Publish to the MCP registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

      - name: Pack the MCPB bundle
        run: |
          npm prune --omit=dev
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . sevdesk-mcp.mcpb

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" sevdesk-mcp.mcpb \
            --title "sevdesk-mcp ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md — https://github.com/joosthel/sevdesk-mcp/blob/main/CHANGELOG.md"
